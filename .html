        class UltraManager {
            constructor() {
                this.userTeamId = 'fla';
                this.teams = JSON.parse(JSON.stringify(BRASILEIRAO_TEAMS));
                this.currentTab = 'dashboard';
                this.currentRound = 1;
                this.maxRounds = 38;
                this.currentYear = 2026;
                this.fixtures = [];
                this.standings = [];
                this.matchHistory = [];
                this.trophies = [];
                this.initApp();
            }

            initApp() {
                this.generateFixtures();
                this.initStandings();
                this.renderHeader();
                this.switchTab('dashboard');
            }

            getUserTeam() {
                return this.teams.find(t => t.id === this.userTeamId);
            }

            getTeamOvr(team) {
                const starters = team.players.filter(p => p.starter);
                if (!starters.length) return 70;
                const sum = starters.reduce((acc, p) => acc + p.ovr, 0);
                return Math.round(sum / starters.length);
            }

            generateFixtures() {
                const teamIds = this.teams.map(t => t.id);
                const numTeams = teamIds.length;
                const rounds = [];
                
                // Round Robin schedule generation
                let tempIds = [...teamIds];
                for (let round = 0; round < numTeams - 1; round++) {
                    const roundMatches = [];
                    for (let i = 0; i < numTeams / 2; i++) {
                        const home = tempIds[i];
                        const away = tempIds[numTeams - 1 - i];
                        roundMatches.push({ home, away, homeGoals: null, awayGoals: null, played: false });
                    }
                    rounds.push(roundMatches);
                    tempIds.splice(1, 0, tempIds.pop());
                }

                // Second leg (Reverse home/away)
                const secondLeg = rounds.map(rMatches => {
                    return rMatches.map(m => ({
                        home: m.away,
                        away: m.home,
                        homeGoals: null,
                        awayGoals: null,
                        played: false
                    }));
                });

                this.fixtures = [...rounds, ...secondLeg];
            }

            initStandings() {
                this.standings = this.teams.map(t => ({
                    id: t.id,
                    name: t.name,
                    short: t.short,
                    pts: 0,
                    p: 0,
                    w: 0,
                    d: 0,
                    l: 0,
                    gf: 0,
                    ga: 0,
                    gd: 0
                }));
            }

            switchTab(tab) {
                this.currentTab = tab;
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-emerald-400');
                    btn.classList.add('hover:text-emerald-400');
                });
                const activeNav = document.getElementById(`nav-${tab}`);
                if (activeNav) {
                    activeNav.classList.add('text-emerald-400');
                }
                this.render();
            }

            renderHeader() {
                const userTeam = this.getUserTeam();
                document.getElementById('user-club-badge').innerText = userTeam.short;
                document.getElementById('user-club-name').innerText = userTeam.name;
                document.getElementById('header-popularity').innerText = userTeam.rep;
                document.getElementById('header-budget').innerText = `R$ ${(userTeam.budget / 1000000).toFixed(1)}M`;
                document.getElementById('header-date').innerText = `Rodada ${this.currentRound} de ${this.maxRounds}`;
                document.getElementById('header-season').innerText = `Brasileirão ${this.currentYear}`;
            }

            render() {
                this.renderHeader();
                const container = document.getElementById('main-container');
                container.innerHTML = '';

                switch (this.currentTab) {
                    case 'dashboard':
                        container.appendChild(this.renderDashboard());
                        break;
                    case 'squad':
                        container.appendChild(this.renderSquad());
                        break;
                    case 'match':
                        container.appendChild(this.renderMatchView());
                        break;
                    case 'competitions':
                        container.appendChild(this.renderCompetitions());
                        break;
                    case 'transfers':
                        container.appendChild(this.renderTransfers());
                        break;
                    case 'trophies':
                        container.appendChild(this.renderTrophies());
                        break;
                }
            }

            renderDashboard() {
                const div = document.createElement('div');
                div.className = 'grid grid-cols-1 md:grid-cols-3 gap-4';

                const userTeam = this.getUserTeam();
                const userOvr = this.getTeamOvr(userTeam);
                const nextMatch = this.getNextMatch(userTeam.id);

                div.innerHTML = `
                    <!-- Quick Stats -->
                    <div class="glass-panel p-4 rounded-xl flex flex-col justify-between">
                        <div>
                            <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Resumo do Clube</div>
                            <h2 class="text-2xl font-bold text-white mt-1">${userTeam.name}</h2>
                            <p class="text-xs text-slate-400">Estádio: ${userTeam.stadium}</p>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-4 text-center">
                            <div class="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
                                <span class="text-[10px] text-slate-400 block">FORÇA OVR</span>
                                <span class="text-xl font-bold text-emerald-400 stat-badge">${userOvr}</span>

            simulateRound() {
                if (this.currentRound > this.maxRounds) {
                    this.showToast('A temporada já foi finalizada!', 'info');
                    return;
                }

                const roundMatches = this.fixtures[this.currentRound - 1];
                if (!roundMatches) return;

                roundMatches.forEach(m => {
                    const homeTeam = this.getTeamById(m.home);
                    const awayTeam = this.getTeamById(m.away);

                    const homeOvr = this.getTeamOvr(homeTeam) + 3; // Home advantage
                    const awayOvr = this.getTeamOvr(awayTeam);

                    // Poisson-like score simulation based on OVR difference
                    const diff = homeOvr - awayOvr;
                    let homeBase = Math.max(0, 1 + Math.floor(diff / 10) + Math.floor(Math.random() * 3));
                    let awayBase = Math.max(0, 1 - Math.floor(diff / 10) + Math.floor(Math.random() * 3));

                    m.homeGoals = Math.min(6, homeBase);
                    m.awayGoals = Math.min(6, awayBase);
                    m.played = true;

                    // Update standings
                    const homeStanding = this.standings.find(s => s.id === m.home);
                    const awayStanding = this.standings.find(s => s.id === m.away);

                    homeStanding.p++;
                    awayStanding.p++;
                    homeStanding.gf += m.homeGoals;
                    homeStanding.ga += m.awayGoals;
                    awayStanding.gf += m.awayGoals;
                    awayStanding.ga += m.homeGoals;
                    homeStanding.gd = homeStanding.gf - homeStanding.ga;
                    awayStanding.gd = awayStanding.gf - awayStanding.ga;

                    if (m.homeGoals > m.awayGoals) {
                        homeStanding.pts += 3;
                        homeStanding.w++;
                        awayStanding.l++;
                    } else if (m.homeGoals < m.awayGoals) {
                        awayStanding.pts += 3;
                        awayStanding.w++;
                        homeStanding.l++;
                    } else {
                        homeStanding.pts += 1;
                        awayStanding.pts += 1;
                        homeStanding.d++;
                        awayStanding.d++;
                    }
                });

                // Matchday revenue for home team
                const userMatch = roundMatches.find(m => m.home === this.userTeamId);
                if (userMatch) {
                    const userTeam = this.getUserTeam();
                    const ticketRevenue = 1500000 + Math.floor(Math.random() * 1000000);
                    userTeam.budget += ticketRevenue;
                    this.showToast(`Receita da Partida (Ingressos): +R$ ${(ticketRevenue / 1000000).toFixed(2)}M`, 'success');
                }

                this.currentRound++;
                if (this.currentRound > this.maxRounds) {
                    this.finishSeason();
                }

                this.render();
            }

            finishSeason() {
                const champion = this.getSortedStandings()[0];
                const userTeam = this.getUserTeam();

                if (champion.id === userTeam.id) {
                    userTeam.realTrophies.br += 1;
                    userTeam.budget += 50000000;
                    this.trophies.push({ year: this.currentYear, title: 'Campeão Brasileirão' });
                    this.showToast('PARABÉNS! Você é o CAMPEÃO do Brasileirão! Prêmio: R$ 50M', 'success');
                } else {
                    this.showToast(`O ${champion.name} venceu o Brasileirão ${this.currentYear}.`, 'info');
                }
            }

            getSortedStandings() {
                return [...this.standings].sort((a, b) => {
                    if (b.pts !== a.pts) return b.pts - a.pts;
                    if (b.w !== a.w) return b.w - a.w;
                    if (b.gd !== a.gd) return b.gd - a.gd;
                    return b.gf - a.gf;
                });
            }

                userTeam.budget -= player.val;

                player.starter = false;
                userTeam.players.push(player);

                this.showToast(`${player.name} foi contratado com sucesso pelo ${userTeam.name}!`, 'success');

            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                let bg = 'bg-slate-800 border-slate-700 text-slate-200';
                if (type === 'success') bg = 'bg-emerald-900/90 border-emerald-500 text-emerald-200';
                if (type === 'danger') bg = 'bg-red-900/90 border-red-500 text-red-200';
                if (type === 'warning') bg = 'bg-amber-900/90 border-amber-500 text-amber-200';

                toast.className = `p-3 rounded-lg border shadow-xl text-xs font-medium backdrop-blur-md transition-all duration-300 pointer-events-auto ${bg}`;
                toast.innerText = msg;

                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3500);

        let app;
